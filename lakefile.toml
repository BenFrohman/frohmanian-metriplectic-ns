name = "frohmanian_metriplectic_ns"
version = "1.0.0"
defaultTargets = ["MetriplecticNS"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0-rc1"

# The Frohmanian tether kernel, imported (not re-proved) from
# BenFrohman/frohmanian-tether-sdiff, pinned to an exact commit.
# Same toolchain (v4.30.0-rc1) and same Mathlib commit (0c154d6) as this repo.
[[require]]
name = "FrohmanianTether"
git = "https://github.com/BenFrohman/frohmanian-tether-sdiff.git"
rev = "8b7bd6741f8a54587db6a95b4a5199dcf2775f97"

[[lean_lib]]
name = "MetriplecticNS"
